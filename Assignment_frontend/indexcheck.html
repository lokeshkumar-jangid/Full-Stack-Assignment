<!DOCTYPE html>
<html>
<head>
<style>

#successMsg{
  
  background: green;
  color: white;
  padding: 10px;
  width: 220px;
  margin-top: 10px;
  border-radius: 5px;
  font-family: Arial;
}

</style>
</head>

<body>

<div class="popupclass" id="popup">

  <div class="modal-content-class">

    <h3>Person Form</h3>

    <input type="text" id="username" placeholder="Username">

    <br><br>

    <button type="button" onclick="saveData()">
      Create
    </button>

    <div id="successMsg">
      User created successfully ✅
    </div>

  </div>

</div>

<script>

function saveData(){

   let msg = document.getElementById("successMsg");

   msg.style.display = "block";

   setTimeout(() => {

      msg.style.display = "none";

   }, 3000);

}

</script>

</body>
</html>
